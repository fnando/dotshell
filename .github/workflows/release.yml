name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump to ${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$VERSION\" isn't a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$current" = "$VERSION" ]; then
            echo "::error::Cargo.toml is already at $VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/v$VERSION" >/dev/null; then
            echo "::error::The branch release/v$VERSION already exists"
            exit 1
          fi
          echo "CURRENT=$current" >> "$GITHUB_ENV"

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Replace the version
        run: |
          old="${CURRENT//./\\.}"
          sed -i "0,/^version = \"$old\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          git diff --stat

      - run: cargo test --locked

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Release v$VERSION."
          git push origin "$branch"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Release v$VERSION" \
            --body "Bumps dotshell from $CURRENT to $VERSION: Cargo.toml and Cargo.lock."
